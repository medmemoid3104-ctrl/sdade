<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واجهة تسجيل الدخول - تدريب</title>
    <!-- استدعاء إطار العمل Tailwind CSS للتصميم السريع -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f2f5f9;
        }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen p-4">

    <!-- حاوية التطبيق بحجم هاتف محمول -->
    <div class="w-full max-w-md bg-white shadow-xl rounded-[32px] p-6 flex flex-col justify-between min-h-[600px] border border-gray-100">
        
        <!-- الجزء العلوي: العنوان أو الشعار -->
        <div class="text-center pt-6">
            <h1 class="text-3xl font-bold text-gray-800">بنك سداد</h1>
            <p class="text-gray-400 text-sm mt-2">يرجى إدخال بيانات حسابك للمتابعة</p>
        </div>

        <!-- نموذج الإدخال -->
        <div class="space-y-6 my-auto">
            
            <!-- حقل رقم الهاتف -->
            <div class="relative w-full">
                <input type="tel" id="phoneInput" inputmode="numeric" placeholder="رقم الهاتف"
                        class="w-full h-16 bg-gray-50 border border-gray-200 rounded-2xl pr-14 pl-6 text-right text-xl text-gray-800 outline-none focus:border-green-600 focus:bg-white transition-all">
                <div class="absolute inset-y-0 right-0 flex items-center pr-5 text-amber-600 text-xl pointer-events-none">
                    <i class="fa-regular fa-user"></i>
                </div>
            </div>

            <!-- خانات إدخال الرمز السري PIN (4 أرقام مقسمة) -->
            <div class="flex justify-between gap-3" dir="ltr">
                <input type="text" inputmode="numeric" maxlength="1" class="pin-input w-full h-16 text-center text-3xl font-bold bg-gray-50 border border-gray-200 rounded-2xl outline-none focus:border-green-600 focus:bg-white transition-all">
                <input type="text" inputmode="numeric" maxlength="1" class="pin-input w-full h-16 text-center text-3xl font-bold bg-gray-50 border border-gray-200 rounded-2xl outline-none focus:border-green-600 focus:bg-white transition-all">
                <input type="text" inputmode="numeric" maxlength="1" class="pin-input w-full h-16 text-center text-3xl font-bold bg-gray-50 border border-gray-200 rounded-2xl outline-none focus:border-green-600 focus:bg-white transition-all">
                <input type="text" inputmode="numeric" maxlength="1" class="pin-input w-full h-16 text-center text-3xl font-bold bg-gray-50 border border-gray-200 rounded-2xl outline-none focus:border-green-600 focus:bg-white transition-all">
            </div>

            <!-- زر تسجيل الدخول -->
            <div>
                <button id="loginBtn" class="w-full h-16 bg-emerald-600 hover:bg-emerald-700 text-white text-xl font-bold rounded-2xl shadow-lg transition-all">
                    تسجيل الدخول
                </button>
            </div>
        </div>

        <!-- الجزء السفلي: روابط إضافية -->
        <div class="text-center pb-4 space-y-2">
            <a href="#" class="text-gray-500 text-sm hover:underline">هل نسيت كلمة المرور؟</a>
        </div>

    </div>

    <!-- كود بسيط لجعل التنقل بين خانات الرمز السري سلسًا -->
    <script>
        const pinInputs = document.querySelectorAll('.pin-input');
        pinInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < pinInputs.length - 1) {
                    pinInputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && input.value.length === 0 && index > 0) {
                    pinInputs[index - 1].focus();
                }
            });
        });
    </script>
</body>
</html>
